base.archivesName = 'vh3_translation_patch-transformer'

dependencies {
    compileOnly 'cpw.mods:modlauncher:9.1.3'
    implementation 'org.ow2.asm:asm-tree:9.7.1'
    implementation 'org.ow2.asm:asm-util:9.7.1'
    implementation 'com.google.code.gson:gson:2.8.9'
    testImplementation 'cpw.mods:modlauncher:9.1.3'
}
def targetJar = providers.gradleProperty('vaultJar').map { rootProject.file(it) }
        .getOrElse(rootProject.file('../../origin-3.21.7/the_vault-1.18.2-3.21.6.6884.jar'))
def vpSource = rootProject.file('../program/基础+硬编码汉化/config/vaultpatcher_asm/the_vault-asm_complex.json')
// 工程已移除接管规则；旧规则仅用于导入及冲突回归测试，不再随汉化配置发布。
def vpLegacySource = rootProject.file('translations/vp/combat_stats.json')

tasks.named('processResources') {
    inputs.property 'mod_version', project.version
    filesMatching('patches/*.properties') { expand mod_version: project.version }
}
tasks.named('jar') {
    manifest.attributes('Automatic-Module-Name': 'com.dricetea.vh3patch.transformer',
            'Implementation-Version': project.version)
}
tasks.named('test') {
    inputs.file targetJar
    inputs.dir vpSource.parentFile
    inputs.file vpLegacySource
    inputs.dir rootProject.file('translations/vp')
    inputs.dir rootProject.file('runtime/src/main/resources/module-defaults')
    systemProperty 'vh3.test.targetJar', targetJar.absolutePath
    systemProperty 'vh3.test.vpSource', vpLegacySource.absolutePath
    systemProperty 'vh3.test.programVpDirectory', vpSource.parentFile.absolutePath
    systemProperty 'vh3.test.legacyVpDirectory', rootProject.file('translations/vp').absolutePath
    systemProperty 'vh3.test.defaultDirectory', rootProject.file('runtime/src/main/resources/module-defaults').absolutePath
    systemProperty 'vh3.test.soundDefaults', rootProject.file('runtime/src/main/resources/module-defaults/sound_names.json').absolutePath
}
tasks.register('verifyTarget', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.dricetea.vh3patch.transformer.PatchTool'
    args 'verify', targetJar.absolutePath, layout.buildDirectory.dir('verification').get().asFile.absolutePath
}
tasks.register('inspectTarget', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.dricetea.vh3patch.transformer.PatchTool'
    args 'inspect', targetJar.absolutePath
}
tasks.register('importMobNames', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.dricetea.vh3patch.transformer.PatchTool'
    args 'import-module', 'combat_stats', vpLegacySource.absolutePath, targetJar.absolutePath, rootProject.projectDir.absolutePath
}

tasks.register('importSoundNames', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.dricetea.vh3patch.transformer.PatchTool'
    args 'import-module', 'sound_names', rootProject.file('translations/vp/sound_names.json').absolutePath,
            targetJar.absolutePath, rootProject.projectDir.absolutePath
}
tasks.register('prepareVpConfig', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.dricetea.vh3patch.transformer.PatchTool'
    args 'prepare-vp', vpSource.absolutePath, layout.buildDirectory.dir('compat').get().asFile.absolutePath
}
