tasks.register('importChestNames', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.dricetea.vh3patch.transformer.PatchTool'
    args 'import-module', 'chest_names', rootProject.file('translations/vp/chest_names.json').absolutePath,
